sonar.projectKey=aurimrv_api-test-generator-system
sonar.organization=aurimrv

# Specify that this is a Python project
sonar.language=py

# Source code directory
sonar.sources=src

# Exclude directories with Java code
sonar.exclusions=output/**,examples/**

# Python-specific settings
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# Optional: if you have tests
# sonar.tests=tests
# sonar.test.inclusions=**/*test*.py,**/test_*.py

# Encoding
sonar.sourceEncoding=UTF-8