openapi: 3.0.0
info:
  title: REST Countries API
  description: Get information about countries via a RESTful API
  version: 2.0.5
  contact:
    name: REST Countries
    url: https://restcountries.eu
servers:
  - url: https://restcountries.eu/rest/v2
    description: Production server
  - url: http://localhost:8090/restcountries-2.0.5/rest
    description: Local test server

paths:
  /v2/all:
    get:
      summary: Get all countries
      description: Returns all countries with basic information
      tags:
        - Countries
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '500':
          description: Internal server error

  /v2/name/{name}:
    get:
      summary: Get country by name
      description: Search for a country by its name
      tags:
        - Countries
      parameters:
        - name: name
          in: path
          required: true
          description: Country name to search for
          schema:
            type: string
            example: "portugal"
      responses:
        '200':
          description: Country found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '404':
          description: Country not found
        '400':
          description: Bad request

  /v2/alpha/{code}:
    get:
      summary: Get country by alpha code
      description: Search for a country by its ISO 3166-1 alpha-2 or alpha-3 code
      tags:
        - Countries
      parameters:
        - name: code
          in: path
          required: true
          description: ISO 3166-1 alpha-2 or alpha-3 country code
          schema:
            type: string
            example: "pt"
      responses:
        '200':
          description: Country found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        '404':
          description: Country not found
        '400':
          description: Bad request

  /v2/currency/{currency}:
    get:
      summary: Get countries by currency
      description: Search for countries that use a specific currency
      tags:
        - Countries
      parameters:
        - name: currency
          in: path
          required: true
          description: Currency code (ISO 4217)
          schema:
            type: string
            example: "eur"
      responses:
        '200':
          description: Countries found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '404':
          description: No countries found for currency
        '400':
          description: Bad request

  /v2/lang/{language}:
    get:
      summary: Get countries by language
      description: Search for countries that speak a specific language
      tags:
        - Countries
      parameters:
        - name: language
          in: path
          required: true
          description: Language code (ISO 639-1)
          schema:
            type: string
            example: "pt"
      responses:
        '200':
          description: Countries found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '404':
          description: No countries found for language
        '400':
          description: Bad request

  /v2/capital/{capital}:
    get:
      summary: Get country by capital
      description: Search for a country by its capital city
      tags:
        - Countries
      parameters:
        - name: capital
          in: path
          required: true
          description: Capital city name
          schema:
            type: string
            example: "lisbon"
      responses:
        '200':
          description: Country found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '404':
          description: Country not found
        '400':
          description: Bad request

  /v2/region/{region}:
    get:
      summary: Get countries by region
      description: Search for countries in a specific region
      tags:
        - Countries
      parameters:
        - name: region
          in: path
          required: true
          description: Region name
          schema:
            type: string
            enum: [Africa, Americas, Asia, Europe, Oceania]
            example: "europe"
      responses:
        '200':
          description: Countries found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '404':
          description: No countries found for region
        '400':
          description: Bad request

components:
  schemas:
    Country:
      type: object
      properties:
        name:
          type: string
          description: Country name
          example: "Portugal"
        topLevelDomain:
          type: array
          items:
            type: string
          description: Top level domains
          example: [".pt"]
        alpha2Code:
          type: string
          description: ISO 3166-1 alpha-2 code
          example: "PT"
        alpha3Code:
          type: string
          description: ISO 3166-1 alpha-3 code
          example: "PRT"
        callingCodes:
          type: array
          items:
            type: string
          description: Calling codes
          example: ["351"]
        capital:
          type: string
          description: Capital city
          example: "Lisbon"
        altSpellings:
          type: array
          items:
            type: string
          description: Alternative spellings
          example: ["PT", "Portuguesa", "Portuguese Republic"]
        region:
          type: string
          description: Region
          example: "Europe"
        subregion:
          type: string
          description: Subregion
          example: "Southern Europe"
        population:
          type: integer
          description: Population
          example: 10374822
        latlng:
          type: array
          items:
            type: number
          description: Latitude and longitude
          example: [39.5, -8.0]
        demonym:
          type: string
          description: Demonym
          example: "Portuguese"
        area:
          type: number
          description: Area in square kilometers
          example: 92090.0
        gini:
          type: number
          description: Gini coefficient
          example: 38.5
        timezones:
          type: array
          items:
            type: string
          description: Timezones
          example: ["UTC-01:00", "UTC"]
        borders:
          type: array
          items:
            type: string
          description: Border countries (alpha3 codes)
          example: ["ESP"]
        nativeName:
          type: string
          description: Native name
          example: "Portugal"
        numericCode:
          type: string
          description: ISO 3166-1 numeric code
          example: "620"
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/Currency'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        translations:
          type: object
          description: Country name translations
        flag:
          type: string
          description: Flag image URL
          example: "https://restcountries.eu/data/prt.svg"
        regionalBlocs:
          type: array
          items:
            $ref: '#/components/schemas/RegionalBloc'
        cioc:
          type: string
          description: International Olympic Committee code
          example: "POR"

    Currency:
      type: object
      properties:
        code:
          type: string
          description: Currency code
          example: "EUR"
        name:
          type: string
          description: Currency name
          example: "Euro"
        symbol:
          type: string
          description: Currency symbol
          example: "€"

    Language:
      type: object
      properties:
        iso639_1:
          type: string
          description: ISO 639-1 language code
          example: "pt"
        iso639_2:
          type: string
          description: ISO 639-2 language code
          example: "por"
        name:
          type: string
          description: Language name
          example: "Portuguese"
        nativeName:
          type: string
          description: Native language name
          example: "Português"

    RegionalBloc:
      type: object
      properties:
        acronym:
          type: string
          description: Regional bloc acronym
          example: "EU"
        name:
          type: string
          description: Regional bloc name
          example: "European Union"
        otherAcronyms:
          type: array
          items:
            type: string
        otherNames:
          type: array
          items:
            type: string

